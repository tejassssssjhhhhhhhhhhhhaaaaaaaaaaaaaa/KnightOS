name: Deploy KnightOS to GitHub Pages

on:
  push:
    branches:
      - v5.2-phase1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload KnightOS site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./knightos

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
